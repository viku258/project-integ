image: node:24
stages: [quality, test, build]
default:
  before_script:
    - npm ci
quality:
  stage: quality
  script:
    - npm run lint
    - npm run format:check
test-sqlite:
  stage: test
  script:
    - npm test
test-postgres:
  stage: test
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_DB: campus_test
    POSTGRES_USER: campus
    POSTGRES_PASSWORD: ci-test-only
    TEST_DATABASE_URL: postgresql://campus:ci-test-only@postgres:5432/campus_test
  script:
    - npm test
build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths: [dist/]
    expire_in: 1 week
